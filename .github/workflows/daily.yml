name: Fetch daily problem

on:
  schedule:
    - cron: "10 0 * * *" # LeetCode's daily challenge rolls over at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_daily.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/daily.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/daily.json
            git commit -m "Daily problem $(date -u +%F)"
            git push
          fi
